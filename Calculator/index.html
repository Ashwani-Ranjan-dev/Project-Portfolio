<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scientific Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="calculator">

    <!-- Calculator Header -->
    <div class="calculator-header">
      <div>
        <span class="brand">SCIENTIFIC</span>
        <h1>Calculator</h1>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>
    </div>

    <!-- Display -->
    <div class="display-container">
      <div class="display-label">EXPRESSION</div>
      <input
        type="text"
        id="display"
        readonly
        placeholder="0"
      >
    </div>

    <!-- Buttons -->
    <div class="buttons">

      <!-- Top Controls -->
      <button class="btn function clear" onclick="clearDisplay()">C</button>
      <button class="btn function delete" onclick="deleteLast()">DEL</button>
      <button class="btn function" onclick="insert('(')">(</button>
      <button class="btn function" onclick="insert(')')">)</button>

      <!-- Numbers -->
      <button class="btn number" onclick="insert('7')">7</button>
      <button class="btn number" onclick="insert('8')">8</button>
      <button class="btn number" onclick="insert('9')">9</button>
      <button class="btn operator" onclick="insert('/')">÷</button>

      <button class="btn number" onclick="insert('4')">4</button>
      <button class="btn number" onclick="insert('5')">5</button>
      <button class="btn number" onclick="insert('6')">6</button>
      <button class="btn operator" onclick="insert('*')">×</button>

      <button class="btn number" onclick="insert('1')">1</button>
      <button class="btn number" onclick="insert('2')">2</button>
      <button class="btn number" onclick="insert('3')">3</button>
      <button class="btn operator" onclick="insert('-')">−</button>

      <button class="btn number zero" onclick="insert('0')">0</button>
      <button class="btn number" onclick="insert('.')">.</button>
      <button class="btn equals" onclick="calculate()">=</button>
      <button class="btn operator" onclick="insert('+')">+</button>

      <!-- Scientific Functions -->
      <button class="btn scientific" onclick="insert('Math.sin(')">
        <span>sin</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.cos(')">
        <span>cos</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.tan(')">
        <span>tan</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.sqrt(')">
        <span>√</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.log(')">
        <span>log</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.pow(')">
        <span>xʸ</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.PI')">
        <span>π</span>
      </button>

      <button class="btn scientific" onclick="insert('Math.E')">
        <span>e</span>
      </button>

    </div>

    <!-- Footer -->
    <div class="calculator-footer">
      <span>SCIENTIFIC MODE</span>
      <span>v1.0</span>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
